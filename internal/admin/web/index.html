    </div>`;
  bindSave();
  q('#toparent').onclick=()=>{commit();SEL.s=-1;renderTree();renderPane()};
  q('#s_status').onchange=e=>{q('#s_status_l').textContent=e.target.checked?'enabled':'disabled'};
  q('#s_name').oninput=()=>{const s2=curStream();if(s2){s2.name=q('#s_name').value.trim();renderTree()}};
  q('#dels').onclick=()=>{
    if(!confirm('Delete stream "'+(s.name||'')+'"?'))return;
    g.streams.splice(SEL.s,1); SEL.s=-1; markDirty(); renderTree(); renderPane();
  };
  const move=(d)=>{
    commit(); const a=g.streams, j=SEL.s+d;
    if(j<0||j>=a.length)return;
    [a[SEL.s],a[j]]=[a[j],a[SEL.s]]; SEL.s=j; markDirty(); renderTree(); renderPane();
  };
  q('#up').onclick=()=>move(-1);
  q('#down').onclick=()=>move(1);
  // add / remove conditions: the model is the source of truth, so commit the
  // form first, change the model, and render the form again.
  const menu=q('#addmenu');
  q('#addcond').onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden};
  menu.onclick=e=>e.stopPropagation();
  menu.querySelectorAll('[data-addcond]').forEach(b=>b.onclick=()=>{
    commit(); COND_OPEN.add(b.dataset.addcond); markDirty(); streamForm();
    const row=q(`.crow[data-cond="${b.dataset.addcond}"]`); const f=row&&row.querySelector('input[type=text],select,input[type=number]'); if(f)f.focus({preventScroll:true});
  });
  qa('#conds [data-rm]').forEach(b=>b.onclick=()=>{
    commit(); resetCond(curStream().rules,b.dataset.rm); COND_OPEN.delete(b.dataset.rm); markDirty(); streamForm();
  });
  const addop=q('#addop'); if(addop)addop.onclick=()=>{q('#ops').insertAdjacentHTML('beforeend',oprow('',1));bindOpDel();markDirty()};
  bindOpDel();
}
function condRow(c,r){
  let body='';
  switch(c.kind){
    case 'list':{const v=lf(r,c.k);body=`${sel('f_'+c.k+'_f',opt(2,'include',v.flag||2)+opt(1,'exclude',v.flag||2))}<input type="text" class="grow" id="f_${c.k}_v" value="${esc(v.vals||v.raw)}" placeholder="${esc(c.ph||'')}">${c.hint?`<div class="hint">${c.hint}</div>`:''}`;break}
    case 'device':body=['computer','phone','tablet'].map(d=>`<label class="chipck dev"><input type="checkbox" id="d_${d}" ${r[d]?'':'checked'}><span>${d}s</span></label>`).join('')+'<div class="hint">checked = allowed</div>';break;
    case 'ops':{const ops=r.operators||{};body=`<div id="ops" style="width:100%">${Object.keys(ops).map(x=>oprow(x,ops[x])).join('')}</div><button class="sm" id="addop">${icon('plus')} operator</button><div class="hint">names come from labels (#name) in wap.dat</div>`;break}
    case 'tri':body=sel('r_'+c.k,c.opts.map((l,i)=>opt(i,l,r[c.k]||0)).join(''));break;
    case 'iplist':{const f=r.ip_list||{};body=`${sel('f_iplist_f',opt(2,'include',f.flag||2)+opt(1,'exclude',f.flag||2))}<input type="text" class="grow" id="f_iplist_file" value="${esc(f.file||'')}" placeholder="name.dat in the data directory">`;break}
    case 'schedule':{const d=(r.schedule&&r.schedule.days)||[];body=`<div class="days">${DAYS.map((n,i)=>`<label><input type="checkbox" class="schd" data-d="${i}" ${d[i]?'checked':''}>${n}</label>`).join('')}</div><div class="hint">the stream works only on the checked days</div>`;break}
    case 'limit':{const l=r.limit||{};body=`${sel('lim_type',opt(1,'per day',l.type||1)+opt(2,'per period',l.type))}<input type="number" id="lim_count" value="${l.count||0}" placeholder="count" style="width:110px"><input type="number" id="lim_sec" value="${l.seconds||0}" placeholder="seconds" style="width:110px"><div class="hint">count, then the window in seconds for "per period" (0 = 24 h); "per day" resets at UTC midnight</div>`;break}
  }
  return `<div class="crow" data-cond="${c.k}"><div class="cl">${c.l}</div><button class="iconbtn xs cx" data-rm="${c.k}" title="Remove condition">${icon('x')}</button><div class="cv">${body}</div></div>`;
}
function resetCond(r,k){
  const c=COND.find(x=>x.k===k); if(!c||!r)return;
  switch(c.kind){
    case 'list':r[k]={flag:0,values:[],raw:''};break;
    case 'device':r.computer=0;r.phone=0;r.tablet=0;break;
    case 'ops':r.operators={};break;
    case 'tri':r[k]=0;break;
    case 'iplist':r.ip_list={flag:0,file:''};break;
    case 'schedule':r.schedule={enabled:false,days:[false,false,false,false,false,false,false]};break;
    case 'limit':r.limit={enabled:false,type:1,count:0,seconds:0};break;
  }
}
function oprow(name,flag){return `<div class="oprow"><input type="text" class="op-n" placeholder="name (as in wap.dat)" value="${esc(name)}">${sel('',opt(1,'block',flag)+opt(2,'require',flag)).replace('<select id=""','<select class="op-f"')}<button class="op-x iconbtn" title="Remove">${icon('x')}</button></div>`}
function bindOpDel(){qa('.op-x').forEach(b=>b.onclick=()=>{b.closest('.oprow').remove();markDirty()})}

function addStream(){
  const g=curGroup(); if(!g)return;
  g.streams=g.streams||[];
  g.streams.push({name:'stream'+((g.streams.length||0)+1),status:true,rules:{},out:{redirect:'http_redirect',out:'',chance:100,distribution:'random'},bots:{redirect:'skip',header:'text/html'}});
  SEL.s=g.streams.length-1; COND_OPEN=new Set(); markDirty(); renderTree(); renderPane();
  const nm=q('#s_name'); if(nm){nm.focus({preventScroll:true});nm.select()}
}
function newGroup(){
  commit();
  GROUPS.push({id:'group'+(GROUPS.length+1),name:'',status:true,redirect:'stop',header:'text/html',out:'',geo:'cf',
    uniq_method:'ip',uniq_seconds:86400,firewall:{enabled:false,queries:100,seconds:60},streams:[]});
  SEL={g:GROUPS.length-1,s:-1}; EXPANDED.add(SEL.g); TREEQ=''; GSET=true; markDirty(); renderTree(); renderPane();
  const id=q('#g_id'); if(id){id.focus({preventScroll:true});id.select()}
}
function delGroup(){
  const g=curGroup(); if(!g)return;
  if(!confirm('Delete group "'+(g.id||'')+'" with all its streams?'))return;
  GROUPS.splice(SEL.g,1);
  SEL={g:GROUPS.length?0:-1,s:-1}; EXPANDED=new Set(SEL.g>=0?[SEL.g]:[]); GSET=false;
  markDirty(); renderTree(); renderPane();
}

/* ---------- model <- forms ---------- */
function readLF(key){
  const t=q('#f_'+key+'_v'), f=q('#f_'+key+'_f');
  if(!t)return{flag:0,values:[],raw:''};
  const raw=t.value.trim();
  if(!raw)return{flag:0,values:[],raw:''};   // an empty list is no filter at all
  // A /regex/ is a single value: splitting on commas would tear apart patterns
  // like /a{2,3}/ and the router would then compile something else entirely.
  if(raw.startsWith('/'))return{flag:+f.value,values:[raw],raw};
  const vals=raw.split(/[\n,]/).map(x=>x.trim()).filter(Boolean);
  return{flag:+f.value,values:vals,raw:vals.join(',')};
}
function collectStream(){
  const s=curStream(); if(!s||!q('#s_name'))return;
  const v=id=>q('#'+id), has=k=>!!q(`.crow[data-cond="${k}"]`);
  s.name=v('s_name').value.trim();
  s.status=v('s_status').checked;
  s.out={redirect:v('s_redirect').value,out:v('s_out').value,chance:+v('s_chance').value||0,distribution:v('s_dist').value};
  s.separation={enabled:v('sep_en').checked,file:v('sep_file').value.trim()};
  const r={};
  LISTKEYS.forEach(k=>{r[k]=has(k)?readLF(k):{flag:0,values:[],raw:''}});
  r.ip_list=has('ip_list')&&v('f_iplist_file').value.trim()?{flag:+v('f_iplist_f').value,file:v('f_iplist_file').value.trim()}:{flag:0,file:''};
  if(has('device')){r.computer=v('d_computer').checked?0:1;r.phone=v('d_phone').checked?0:1;r.tablet=v('d_tablet').checked?0:1}
  else{r.computer=0;r.phone=0;r.tablet=0}
  r.unique=has('unique')?+v('r_unique').value:0;
  r.yabrowser=has('yabrowser')?+v('r_yabrowser').value:0;
  r.has_referer=has('has_referer')?+v('r_has_referer').value:0;
  const ops={}; if(has('operators'))qa('#ops .oprow').forEach(row=>{const n=row.querySelector('.op-n').value.trim();if(n)ops[n]=+row.querySelector('.op-f').value});
  r.operators=ops;
  const days=[false,false,false,false,false,false,false]; if(has('schedule'))qa('.schd').forEach(c=>days[+c.dataset.d]=c.checked);
  r.schedule={enabled:has('schedule'),days};
  r.limit=has('limit')?{enabled:true,type:+v('lim_type').value,count:+v('lim_count').value||0,seconds:+v('lim_sec').value||0}:{enabled:false,type:1,count:0,seconds:0};
  s.rules=r;
  const bchk=id=>{const e=q('#b_'+id);return e?e.checked:false};
  const bots={};
  BOTCHK.forEach(([id])=>bots[id]=bchk(id));
  bots.save_ip=bchk('save_ip');
  bots.redirect=v('b_redirect').value; bots.header=v('b_header').value; bots.out=v('b_out').value;
  s.bots=bots;
  const gv=id=>{const e=q('#'+id);return e?e.value:''};
  s.curl=gv('s_curl'); s.b_curl=gv('b_curl');
  s.remote={enabled:!!(q('#rm_en')&&q('#rm_en').checked),url:gv('rm_url'),regexp:gv('rm_re'),reserved:gv('rm_res'),cache:+gv('rm_cache')||0};
  s.api_mac={enabled:!!(q('#am_en')&&q('#am_en').checked),code:gv('am_code'),prob:+gv('am_prob')||0};
}
function collectGroup(){
  const g=curGroup(); if(!g||!q('#g_id'))return;
  const v=id=>q('#'+id);
  g.id=v('g_id').value.trim(); g.name=v('g_name').value.trim();
  g.aliases=v('g_aliases').value.split(',').map(x=>x.trim()).filter(Boolean);
  g.geo=v('g_geo').value; g.redirect=v('g_redirect').value; g.header=v('g_header').value;
  g.uniq_method=v('g_uniq').value; g.uniq_seconds=+v('g_uniqsec').value||86400; g.out=v('g_out').value;
  g.status=v('g_status').checked;
  g.save_keys=v('g_savekeys').checked; g.save_keys_se=v('g_savekeys_se').checked;
  g.firewall={enabled:v('fw_en').checked,queries:+v('fw_q').value||0,seconds:+v('fw_s').value||0};
}
// Exactly one form is mounted, so both collectors run and the one that is not
// on screen sees no fields and returns immediately.
function commit(){collectStream();collectGroup()}

async function saveAll(){
  commit();
  const msg=q('#gmsg')||{};
  const ids=GROUPS.map(g=>(g.id||'').trim());
  const dup=ids.find((x,i)=>x&&ids.indexOf(x)!==i);
  if(ids.some(x=>!x)){msg.innerHTML='<span class="err">every group needs an ID</span>';return}
  if(dup){msg.innerHTML='<span class="err">duplicate group id: '+esc(dup)+'</span>';return}
  msg.textContent='saving…';
  const r=await api('/api/groups',{method:'PUT',headers:{'X-CSRF-Token':CSRF,'Content-Type':'application/json'},body:JSON.stringify(GROUPS)});
  const j=await r.json().catch(()=>({}));
  const m=q('#gmsg'); if(!m)return;
  if(r.ok){clearDirty();m.innerHTML='<span class="ok">saved ✓</span>';renderTree();setTimeout(()=>{if(m.isConnected&&!DIRTY)m.innerHTML=''},2500)}
  else m.innerHTML='<span class="err">'+esc(j.error||'error')+'</span>';
}

/* ---------- LISTS (.dat) ---------- */
async function lists(){
  view().innerHTML=stateHTML('loading…');
  const names=await api('/api/lists').then(r=>r.json()).catch(()=>[]);
  view().innerHTML=`
    <div class="row" style="margin-bottom:12px">
      <select id="lname">${(names||[]).map(n=>`<option>${esc(n)}</option>`).join('')}</select>
      <div class="spacer"></div><span id="lmsg" class="muted"></span><button class="primary" id="lsave">Save</button>
    </div>
    <textarea id="ldata" spellcheck="false" class="code muted">select a list…</textarea>
    <p class="muted">Lists: bot IP bases (ip_*.dat), WAP operators (wap.dat — lines with # set the operator name), signatures (signature_*.dat), blacklists. The engine picks up changes on its reload interval.</p>`;
  const s=q('#lname');
  s.onchange=()=>loadList(s.value);
  q('#lsave').onclick=saveList;
  if(names&&names.length)loadList(names[0]); else q('#ldata').value='(no lists in the data directory)';
}
async function loadList(name){
  const ta=q('#ldata');ta.classList.add('muted');ta.value='loading…';
  const j=await api('/api/lists/'+encodeURIComponent(name)).then(r=>r.json()).catch(()=>null);
  ta.classList.remove('muted');ta.value=j?j.content:'';
}
async function saveList(){
  const name=q('#lname').value, content=q('#ldata').value;
  const msg=q('#lmsg');
  const r=await api('/api/lists/'+encodeURIComponent(name),{method:'PUT',headers:{'X-CSRF-Token':CSRF,'Content-Type':'application/json'},body:JSON.stringify({content})});
  const j=await r.json().catch(()=>({}));
  msg.innerHTML=r.ok?'<span class="ok">saved ✓</span>':'<span class="err">'+esc(j.error||'error')+'</span>';
}

function render(node){const a=q('#app');a.innerHTML='';a.appendChild(node)}
// close open dropdowns on outside click
document.addEventListener('click',()=>{qa('.msel.open').forEach(m=>m.classList.remove('open'));const am=q('#addmenu');if(am)am.hidden=true});
// Ctrl/Cmd+S saves the groups editor instead of the browser's "save page".
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'&&TAB==='groups'){e.preventDefault();saveAll()}
});
// Follow the OS theme while the user has not chosen one explicitly.
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.documentElement.getAttribute('data-theme')){syncTheme();if(TAB==='dashboard')drawChart(q('#chart'),CH.pts)}});
// Last line of defence against losing edits by closing the tab.
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
boot();
